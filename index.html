<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售管理系统 · 电子合同演示</title>
<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --border:#e3e8f0; --text:#1c2536; --muted:#66728a;
  --primary:#2f6bff; --primary-h:#2459e0; --primary-weak:#e9f0ff;
  --green:#128a4c; --green-weak:#e4f6ec;
  --amber:#b45309; --amber-weak:#fdf1df;
  --red:#d92d20; --red-weak:#fdeceb;
  --purple:#7c3aed; --purple-weak:#f3edff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
  --bg:#0f141d; --card:#171e2b; --border:#2a3446; --text:#e8edf6; --muted:#93a0b8;
  --primary:#5b8bff; --primary-h:#7aa2ff; --primary-weak:#1d2a47;
  --green:#3fc37e; --green-weak:#12301f;
  --amber:#f0b45e; --amber-weak:#33230f;
  --red:#f4706a; --red-weak:#3a1b19;
  --purple:#a78bfa; --purple-weak:#2a2140;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f141d; --card:#171e2b; --border:#2a3446; --text:#e8edf6; --muted:#93a0b8;
  --primary:#5b8bff; --primary-h:#7aa2ff; --primary-weak:#1d2a47;
  --green:#3fc37e; --green-weak:#12301f;
  --amber:#f0b45e; --amber-weak:#33230f;
  --red:#f4706a; --red-weak:#3a1b19;
  --purple:#a78bfa; --purple-weak:#2a2140;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 20px;height:60px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .tag{font-size:11px;font-weight:500;color:var(--primary);background:var(--primary-weak);padding:2px 8px;border-radius:99px}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin:0 auto}
.seg button{border:none;background:transparent;padding:7px 16px;border-radius:8px;font-size:13.5px;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.seg button.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:var(--shadow)}
.identity{display:flex;align-items:center;flex-shrink:0}
.identity select{width:120px;padding:7px 10px;font-size:13px}
.id-fixed{font-size:12.5px;color:var(--muted);white-space:nowrap;border:1px dashed var(--border);border-radius:8px;padding:6px 12px}
.user{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.uavatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}

/* ── 布局 ── */
.layout{display:flex}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding:10px 10px 14px;background:var(--card);display:flex;flex-direction:column}
.nav-sec{font-size:11px;color:var(--muted);padding:14px 14px 6px;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:none;background:none;border-radius:10px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit;text-align:left;margin-bottom:4px;transition:.12s}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:12px 14px 4px;font-size:11.5px;color:var(--muted);line-height:1.6}
main{flex:1;padding:24px;min-width:0}
.container{max-width:1120px;margin:0 auto}

/* ── 通用 ── */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
tr.clickable{cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-green{color:var(--green);background:var(--green-weak)}
.b-amber{color:var(--amber);background:var(--amber-weak)}
.b-red{color:var(--red);background:var(--red-weak)}
.b-blue{color:var(--primary);background:var(--primary-weak)}
.b-purple{color:var(--purple);background:var(--purple-weak)}
.b-gray{color:var(--muted);background:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h);color:#fff}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover{filter:brightness(1.1);color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.1);color:#fff}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--primary)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.auto-box{background:var(--bg);border:1px dashed var(--border);border-radius:9px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.auto-box b{color:var(--text)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:13.5px;line-height:1.8}
.boss-sel{width:190px;padding:6px 8px;font-size:12.5px}

/* ── 单位详情 ── */
.comp-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.comp-head .avatar{width:52px;height:52px;border-radius:14px;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.comp-head h2{font-size:19px}
.stat{min-width:130px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.contact-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.contact-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.contact-card .name{font-weight:600;font-size:14.5px}
.contact-card .line{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;word-break:break-all}

/* ── 审批进度条 ── */
.steps{display:flex;align-items:flex-start;min-width:230px}
.step{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.step .dot{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--border);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.step .lb{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.done .lb{color:var(--green)}
.step.active .dot{background:var(--amber);border-color:var(--amber);color:#fff}
.step.active .lb{color:var(--amber)}
.step.reject .dot{background:var(--red);border-color:var(--red);color:#fff}
.step.reject .lb{color:var(--red)}
.step-line{height:2px;flex:1;min-width:28px;background:var(--border);margin-top:8px;border-radius:2px}
.step-line.on{background:var(--green)}
.step-line.reject{background:var(--red)}

/* ── 审批页 tabs ── */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:7px 16px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:13.5px;font-family:inherit;transition:.12s}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

/* ── 统计信息 ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.rank-row{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:12px;padding:7px 0;cursor:default}
.rank-name{font-size:13px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-track{background:var(--bg);border-radius:99px;height:14px;overflow:hidden}
.rank-fill{height:100%;border-radius:0 4px 4px 0;transition:filter .12s}
.rank-row:hover .rank-fill{filter:brightness(1.12)}
.rank-val{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stack{display:flex;height:20px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:12px}
.stack-seg{min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px;color:var(--muted)}
.lg-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.viz{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--st-good:#0ca30c;--st-warn:#fab219;--st-crit:#d03b3b}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) .viz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
}
:root[data-theme="dark"] .viz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
#tip{position:fixed;z-index:300;background:#1c2536;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.7;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:250px}

/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:rgba(10,15,25,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mask[hidden]{display:none}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:540px;max-height:720px;overflow:auto;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:17px;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;font-size:13.5px}
.info-grid .k{color:var(--muted);font-size:12.5px}
.info-grid .v{font-weight:600;margin-top:2px;word-break:break-all}
.timeline{display:flex;flex-direction:column}
.t-item{display:flex;gap:14px;position:relative;padding-bottom:20px}
.t-item:last-child{padding-bottom:0}
.t-item::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--border)}
.t-item:last-child::before{display:none}
.t-dot{width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:4px;flex-shrink:0}
.t-item .what{font-size:14px;font-weight:600}
.t-item .when{font-size:12px;color:var(--muted);margin-top:2px}

/* ── toast ── */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#1c2536;color:#fff;padding:11px 22px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:86vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ── 响应式 ── */
@media (max-width:1000px){
  .brand .tag{display:none}
}
@media (max-width:880px){
  .topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px}
  .seg{margin:0;order:3;width:100%}
  .seg button{flex:1}
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-direction:row;overflow-x:auto;padding:8px}
  .nav-item{white-space:nowrap;width:auto;margin:0 4px 0 0}
  .nav-sec,.side-foot{display:none}
  main{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .page-head input,.page-head select{width:100% !important}
  .rank-row{grid-template-columns:90px 1fr 100px}
}
</style>
</head>
<body>

<header class="topbar">

  <div class="seg">

  <div class="identity" id="identity"></div>

</header>

<div class="layout">

  <main id="main"></main>
</div>

<div class="mask" id="mask" hidden onclick="if(event.target===this)closeModal()"></div>
<div id="tip" hidden></div>
<div id="toast"></div>

const money = n => '¥' + Number(n).toLocaleString('zh-CN');
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function nextNo(){
  const d = new Date();

}

}

/* ═══════════ 权限与审批流 ═══════════ */
function sanitize(){
  for (const r of ['sales','director']){
    const L = levelOf(r);
    if (!staff.some(s => s.id===currentIds[r] && s.level===L)){
      const f = staff.find(s => s.level===L);
      currentIds[r] = f ? f.id : null;
    }
  }
  currentIds.boss = 'u0';
}
/* 合同当前应流转给谁审批 */
function routedApproverName(c){
  const s = staff.find(x => x.id===c.salesId);
  if (!s) return '老板';
  if (s.level===3) return s.name;            // 老板提交 → 老板自己审批
  if (s.level===2) return '老板';             // 总监提交 → 上级（老板）审批
  const b = staff.find(x => x.id===s.bossId); // 专员提交 → 其直属总监审批
  return b ? b.name : '老板（未分配上级）';
}
function canApprove(c){
  const me = cur(); if (!me) return false;
  if (me.level===3) return true;              // 老板可审批全部待审批
  if (me.level===2){                          // 总监只审批直属专员提交的
    const s = staff.find(x => x.id===c.salesId);
    return !!s && s.level===1 && s.bossId===me.id;
  }
  return false;
}
function myQueue(){ return contracts.filter(c => c.status==='待审批' && canApprove(c)); }
function visibleTo(me, c){
  if (me.level===3) return true;              // 老板看全部
  const s = staff.find(x => x.id===c.salesId);
  if (!s) return false;
  if (me.level===1) return s.id===me.id;      // 专员看自己
  return s.id===me.id || s.bossId===me.id;    // 总监看自己 + 下属
}

}

}

function submitReject(e, id){

function onNsLevel(){ $('ns-boss-field').style.display = $('ns-level').value === '1' ? '' : 'none'; }
function submitNewStaff(e){
  e.preventDefault();
  const name = $('ns-name').value.trim();
  if (!name){ toast('⚠️ 请输入姓名'); return false; }
  const level = parseInt($('ns-level').value);
  const used = staff.map(s => s.slot); let slot = 1; while (used.includes(slot) && slot < 8) slot++;
  staff.push({ id:'u' + Date.now(), name, level, bossId: level===1 ? $('ns-boss').value : null, createdAt: todayStr(), slot });
  closeModal();
  toast(level===1 ? '✅ 销售专员「' + name + '」已创建' : '✅ 销售总监「' + name + '」已创建（具有审批权）');
  sanitize(); render();
  return false;
}
function assignBoss(uid, val){
  const s = staff.find(x => x.id === uid); if (!s) return;
  s.bossId = val;
  toast(val
    ? '✅ 「' + s.name + '」的审批上级已设为「' + staff.find(x => x.id===val).name + '」'
    : '已清除「' + s.name + '」的审批上级，其合同暂由老板审批');
  render();
}
function promote(id){
  const s = staff.find(x => x.id === id);
  if (!s || s.level !== 1) return;
  if (!confirm('确认将「' + s.name + '」晋升为销售总监？\n晋升后其提交的合同将流转给老板审批，且可审批直属专员的合同。')) return;
  s.level = 2; s.bossId = null;
  toast('✅ 「' + s.name + '」已晋升为销售总监');
  sanitize(); render();
}
function demote(id){
  const s = staff.find(x => x.id === id);
  if (!s || s.level !== 2) return;
  if (!confirm('确认将「' + s.name + '」降级为销售专员？\n其下属专员的审批归属将被清除（合同暂由老板审批）。')) return;
  staff.forEach(x => { if (x.level === 1 && x.bossId === id) x.bossId = ''; });
  s.level = 1;
  const other = staff.find(x => x.level === 2 && x.id !== id);
  s.bossId = other ? other.id : '';
  toast('✅ 「' + s.name + '」已降级为销售专员');
  sanitize(); render();
}

  tipData = {};
  rank.forEach(r => { tipData[r.s.id] = { name:r.s.name, n:r.n, p:r.p, amt:r.amt }; });
  const stCount = { '待审批':0, '已通过':0, '已驳回':0 };
  contracts.forEach(c => { if (c.status in stCount) stCount[c.status]++; });
  const kpi = (k,v,sub) => '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + sub + '</div></div>';
  const stSeg = [['待审批','--st-warn','⏳'],['已通过','--st-good','✓'],['已驳回','--st-crit','✕']];
  $('main').innerHTML = '<div class="container">' +

      rank.map(r =>
        '<div class="rank-row" onmouseenter="showTip(event,\'' + r.s.id + '\')" onmousemove="moveTip(event)" onmouseleave="hideTip()">' +
        '<div class="rank-name">' + esc(r.s.name) + ' <span class="hint">' + levelName(r.s.level) + '</span></div>' +
        '<div class="rank-track">' + (r.amt > 0 ? '<div class="rank-fill" style="width:' + (r.amt / max * 100) + '%;background:var(--s' + r.s.slot + ')"></div>' : '') + '</div>' +
        '<div class="rank-val">' + money(r.amt) + ' · ' + r.n + ' 份</div></div>').join('') +
    '</div></div>' +
    '<div class="card"><h3>合同状态分布</h3><div class="viz">' +
      '<div class="stack">' + stSeg.map(([st,c]) => stCount[st]
        ? '<div class="stack-seg" style="flex:' + stCount[st] + ';background:var(' + c + ')" title="' + st + ' ' + stCount[st] + ' 份"></div>' : '').join('') + '</div>' +
      '<div class="legend">' + stSeg.map(([st,c,ic]) =>
        '<span><span class="lg-dot" style="background:var(' + c + ')"></span>' + ic + ' ' + st + ' <b>' + stCount[st] + '</b> 份</span>').join('') + '</div>' +
    '</div></div></div>';
}
function showTip(e, id){
  const r = tipData[id]; if (!r) return;
  const t = $('tip');
  t.innerHTML = '<b>' + esc(r.name) + '</b><br>合同 ' + r.n + ' 份 · 待审批 ' + r.p + ' 份<br>合同总额 ' + money(r.amt);
  t.hidden = false;
  moveTip(e);
}
function moveTip(e){
  const t = $('tip');
  t.style.left = Math.min(e.clientX + 14, window.innerWidth - 260) + 'px';
  t.style.top = (e.clientY + 14) + 'px';
}
function hideTip(){ $('tip').hidden = true; }

/* ═══════════ 弹窗：新建单位 / 新建联系人 / 合同详情 ═══════════ */
function modalNewCompany(){
  showModal('<div class="modal"><h3>新建单位</h3>' +
    '<form onsubmit="return submitNewCompany(event)">' +
    '<div class="field"><label>单位名称 *</label><input id="nc-name" required placeholder="请输入单位名称"></div>' +
    '<div class="field"><label>初始余额（元）</label><input id="nc-balance" type="number" min="0" step="0.01" value="0"></div>' +
    '<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary">创建</button></div>' +
    '</form></div>');
}
function submitNewCompany(e){
  e.preventDefault();
  const name = $('nc-name').value.trim();
  if (!name){ toast('⚠️ 请输入单位名称'); return false; }
  const id = 'c' + Date.now();
  companies.push({ id, name, balance: parseFloat($('nc-balance').value) || 0, contacts:[], projects:[] });
  closeModal();
  toast('✅ 单位「' + name + '」已创建');
  view = 'company'; param = id; render();
  return false;
}
function modalNewContact(cid){
  const c = companies.find(x => x.id === cid);
  showModal('<div class="modal"><h3>新建联系人</h3>' +
    '<div class="hint" style="margin-bottom:14px">将自动绑定到单位：<b>' + esc(c.name) + '</b></div>' +
    '<form onsubmit="return submitNewContact(event)">' +
    '<div class="field"><label>联系人名称 *</label><input id="nc-name" required placeholder="请输入联系人名称"></div>' +
    '<div class="field"><label>联系电话 *</label><input id="nc-phone" required placeholder="请输入联系电话"></div>' +
    '<div class="field"><label>邮箱</label><input id="nc-email" type="email" placeholder="name@example.com"></div>' +
    '<div class="field"><label>快递地址</label><input id="nc-addr" placeholder="请输入快递地址"></div>' +
    '<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary">保存</button></div>' +
    '</form></div>');
}
function submitNewContact(e){
  e.preventDefault();
  const c = companies.find(x => x.id === param);
  if (!c) return false;
  const name = $('nc-name').value.trim(), phone = $('nc-phone').value.trim(),
        email = $('nc-email').value.trim(), addr = $('nc-addr').value.trim();
  if (!name || !phone){ toast('⚠️ 请至少填写联系人名称和联系电话'); return false; }
  c.contacts.push({ id:'t' + Date.now(), name, phone, email: email || '—', address: addr || '—' });
  closeModal();
  toast('✅ 联系人「' + name + '」已添加，自动绑定「' + c.name + '」');
  render();
  return false;
}
function modalContract(id){
  const c = contracts.find(x => x.id === id);
  if (!c) return;
  const dotColor = c.status === '已通过' ? 'var(--green)' : (c.status === '已驳回' ? 'var(--red)' : 'var(--amber)');
  showModal('<div class="modal"><h3>合同详情 <span class="mono" style="font-weight:400;font-size:13px">' + c.no + '</span></h3>' +
    '<div class="info-grid">' +
      '<div><div class="k">合同名称</div><div class="v">' + esc(c.name) + '</div></div>' +
      '<div><div class="k">项目产品</div><div class="v">' + esc(c.product) + '</div></div>' +
      '<div><div class="k">客户单位</div><div class="v">' + esc(c.companyName) + '</div></div>' +
      '<div><div class="k">联系人</div><div class="v">' + esc(c.contactName) + '</div></div>' +
      '<div><div class="k">样本数量</div><div class="v">' + c.samples + ' 例</div></div>' +
      '<div><div class="k">合同金额</div><div class="v">' + money(c.amount) + '</div></div>' +
      '<div><div class="k">销售</div><div class="v">' + esc(c.sales) + '</div></div>' +
      '<div><div class="k">当前状态</div><div class="v">' + statusBadge(c.status) + '</div></div>' +
    '</div>' +
    '<h3 style="margin:20px 0 12px">审批进度</h3>' +
    '<div class="timeline">' +
      '<div class="t-item"><div class="t-dot"></div><div><div class="what">合同已提交</div><div class="when">' + c.date + ' · ' + esc(c.sales) + '</div></div></div>' +
      (c.status === '待审批'
        ? '<div class="t-item"><div class="t-dot" style="background:var(--amber)"></div><div><div class="what">等待「' + esc(routedApproverName(c)) + '」审批</div><div class="when">当前环节</div></div></div>'
        : '<div class="t-item"><div class="t-dot" style="background:' + dotColor + '"></div><div><div class="what">' + (c.status === '已通过' ? '审批通过' : '审批驳回') + '</div><div class="when">' + c.approveDate + ' · ' + esc(c.approver) + (c.reason ? ' · 原因：' + esc(c.reason) : '') + '</div></div></div>') +
    '</div>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div></div>');
}

/* ═══════════ 启动 ═══════════ */
sanitize();
render();
</script>
</body>
</html>
