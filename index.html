<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售管理系统 · 销售端</title>
<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --border:#e3e8f0; --text:#1c2536; --muted:#66728a;
  --primary:#2f6bff; --primary-h:#2459e0; --primary-weak:#e9f0ff;
  --green:#128a4c; --green-weak:#e4f6ec;
  --amber:#b45309; --amber-weak:#fdf1df;
  --red:#d92d20; --red-weak:#fdeceb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
  --bg:#0f141d; --card:#171e2b; --border:#2a3446; --text:#e8edf6; --muted:#93a0b8;
  --primary:#5b8bff; --primary-h:#7aa2ff; --primary-weak:#1d2a47;
  --green:#3fc37e; --green-weak:#12301f;
  --amber:#f0b45e; --amber-weak:#33230f;
  --red:#f4706a; --red-weak:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f141d; --card:#171e2b; --border:#2a3446; --text:#e8edf6; --muted:#93a0b8;
  --primary:#5b8bff; --primary-h:#7aa2ff; --primary-weak:#1d2a47;
  --green:#3fc37e; --green-weak:#12301f;
  --amber:#f0b45e; --amber-weak:#33230f;
  --red:#f4706a; --red-weak:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 20px;height:60px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .tag{font-size:11px;font-weight:500;color:var(--primary);background:var(--primary-weak);padding:2px 8px;border-radius:99px}
.user{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);white-space:nowrap}
.uavatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}

/* ── 布局 ── */
.layout{display:flex}
.sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--border);padding:14px 10px;background:var(--card);display:flex;flex-direction:column}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:none;background:none;border-radius:10px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit;text-align:left;margin-bottom:4px;transition:.12s}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
.side-foot{margin-top:auto;padding:12px 14px 4px;font-size:11.5px;color:var(--muted);line-height:1.6}
main{flex:1;padding:24px;min-width:0}
.container{max-width:1120px;margin:0 auto}

/* ── 通用 ── */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
tr.clickable{cursor:pointer}
tr.totals-row td{background:var(--bg);font-weight:700;border-top:1px solid var(--border)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-green{color:var(--green);background:var(--green-weak)}
.b-amber{color:var(--amber);background:var(--amber-weak)}
.b-red{color:var(--red);background:var(--red-weak)}
.b-blue{color:var(--primary);background:var(--primary-weak)}
.b-gray{color:var(--muted);background:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h);color:#fff}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover{filter:brightness(1.1);color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.1);color:#fff}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--primary)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:32px 0;font-size:13.5px;line-height:1.8}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--primary)}
.crumb .sep{opacity:.5}
.crumb .cur{color:var(--text);font-weight:600}

/* ── 客户详情 ── */
.detail-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.detail-head .avatar{width:52px;height:52px;border-radius:14px;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.detail-head h2{font-size:19px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 20px;font-size:13.5px}
.info-grid .k{color:var(--muted);font-size:12.5px}
.info-grid .v{font-weight:600;margin-top:2px;word-break:break-all}
.stat{min-width:110px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px}

/* ── 合同展开区 ── */
.exp-area{padding:14px 18px 18px;border-top:1px solid var(--border);background:var(--bg)}
.exp-area .exp-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exp-area h4{font-size:13.5px}

/* ── 认款进度 ── */
.pay-track{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:8px}
.pay-fill{height:100%;border-radius:99px;background:var(--green);transition:width .3s}
.pay-fill.orange{background:var(--amber)}
.btn-orange{background:var(--amber);border-color:var(--amber);color:#fff}
.btn-orange:hover{filter:brightness(1.1);color:#fff}

/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:rgba(10,15,25,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mask[hidden]{display:none}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:720px;overflow:auto;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:17px;margin-bottom:14px}
.modal .sec-title{font-size:14px;font-weight:700;margin:18px 0 10px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.add-box{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:14px;margin:12px 0}
.add-form{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:10px;align-items:end}
.add-form .field{margin-bottom:0}
.auto-box{background:var(--bg);border:1px dashed var(--border);border-radius:9px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.auto-box b{color:var(--text)}

/* ── toast ── */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#1c2536;color:#fff;padding:11px 22px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:86vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ── 响应式 ── */
@media (max-width:880px){
  .topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px}
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-direction:row;overflow-x:auto;padding:8px}
  .nav-item{white-space:nowrap;width:auto;margin:0 4px 0 0}
  .side-foot{display:none}
  main{padding:16px}
  .form-grid,.add-form{grid-template-columns:1fr}
  .page-head input{width:100% !important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🧬 销售管理系统 <span class="tag">销售端 · 演示</span></div>
  <div class="user"><span class="uavatar">张</span><span><b>张三</b> · 销售专员</span></div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<div class="mask" id="mask" hidden onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
'use strict';
/* ═══════════ 数据（纯演示：刷新后重置） ═══════════ */
/* 产品目录：单价元/例（后续由运营页面维护） */
const PRODUCTS = [
  { id:'p1',  name:'全基因组测序',   price:800  },
  { id:'p2',  name:'全外显子组测序', price:500  },
  { id:'p3',  name:'转录组测序',     price:450  },
  { id:'p4',  name:'单细胞测序',     price:1000 },
  { id:'p5',  name:'肿瘤基因检测',   price:600  },
  { id:'p6',  name:'无创产前检测',   price:950  },
  { id:'p7',  name:'病原微生物检测', price:350  },
  { id:'p8',  name:'宏基因组测序',   price:700  },
  { id:'p9',  name:'表观遗传检测',   price:400  },
  { id:'p10', name:'代谢组检测',     price:300  },
];
/* 客户：单位是字段 */
const SEED_CUSTOMERS = [
  { id:'cu1', name:'陈静', phone:'138****2210', email:'chenjing@huake.com', org:'华科生物科技有限公司',
    address:'北京市海淀区中关村大街 1 号', invoice:'增值税专用发票 · 华科生物科技有限公司 · 税号 91110108MA01XXXXX' },
  { id:'cu2', name:'王丽', phone:'136****3345', email:'wangli@lanhai.com', org:'蓝海医疗集团',
    address:'上海市浦东新区张江路 88 号', invoice:'增值税普通发票 · 蓝海医疗集团 · 税号 91310115MA1KXXXXXX' },
  { id:'cu3', name:'孙悦', phone:'137****1122', email:'sunyue@xingchen.com', org:'星辰基因科技',
    address:'深圳市南山区科技园南区 12 栋', invoice:'增值税专用发票 · 星辰基因科技 · 税号 91440300MA5FXXXXXX' },
  { id:'cu4', name:'周涛', phone:'134****9988', email:'zhoutao@kangtai.com', org:'康泰制药股份',
    address:'杭州市滨江区江南大道 200 号', invoice:'增值税专用发票 · 康泰制药股份 · 税号 91330100MA2JXXXXXX' },
];
/* 大合同：客户之下 */
const SEED_CONTRACTS = [
  { id:'ct1', customerId:'cu1', name:'华科万人基因组二期合同', offlineNo:'HT-2026-0001', amount:480000, startDate:'2026-11-01', termYears:3 },
  { id:'ct2', customerId:'cu2', name:'蓝海产前检测服务合同', offlineNo:'HT-2026-0008', amount:98000,  startDate:'2026-09-15', termYears:3 },
  { id:'ct3', customerId:'cu3', name:'星辰病原检测年度合同', offlineNo:'HT-2026-0015', amount:320000, startDate:'2026-10-08', termYears:3 },
  { id:'ct4', customerId:'cu1', name:'华科肿瘤早筛二期合同', offlineNo:'HT-2026-0021', amount:215000, startDate:'2026-11-18', termYears:3 },
  { id:'ct5', customerId:'cu4', name:'康泰药物基因组合同',   offlineNo:'HT-2026-0030', amount:152000, startDate:'2026-11-20', termYears:3 },
];
/* 分析批次：合同之下；状态流转：待提交 → 提交审批 → 待审批 →（领导审批）已通过 / 已驳回 */
const SEED_BATCHES = [
  { id:'b1', contractId:'ct1', name:'万人基因组第一批', no:'PC20261112-001', createdAt:'2026-11-12 10:23', status:'待审批',
    items:[ { product:'全基因组测序', samples:500, discount:10 },
            { product:'肿瘤基因检测', samples:200, discount:0 } ],
    payments:[ { time:'2026-11-13 09:15', amount:200000, note:'首付款' } ],
    invoiceTotal:480000,
    invoices:[ { time:'2026-11-13 10:30', amount:100000, note:'首批开票' } ] },
  { id:'b2', contractId:'ct2', name:'孕妇队列第一批', no:'PC20261115-001', createdAt:'2026-11-15 14:02', status:'待提交',
    items:[ { product:'无创产前检测', samples:300, discount:15 } ],
    payments:[],
    invoiceTotal:306000,
    invoices:[] },
  { id:'b3', contractId:'ct3', name:'病原溯源批次', no:'PC20261116-001', createdAt:'2026-11-16 09:40', status:'已通过',
    items:[ { product:'病原微生物检测', samples:1000, discount:20 } ],
    payments:[ { time:'2026-11-16 16:30', amount:320000, note:'全款' } ],
    invoiceTotal:320000,
    invoices:[ { time:'2026-11-16 17:00', amount:320000, note:'' } ] },
  { id:'b5', contractId:'ct4', name:'肺癌早筛批次', no:'PC20261119-001', createdAt:'2026-11-19 11:05', status:'待提交',
    items:[ { product:'肿瘤基因检测', samples:150, discount:10 } ],
    payments:[],
    invoiceTotal:81000,
    invoices:[] },
  { id:'b4', contractId:'ct5', name:'药物基因组批次', no:'PC20261120-001', createdAt:'2026-11-20 16:12', status:'已驳回',
    items:[ { product:'全基因组测序', samples:200, discount:5 },
            { product:'宏基因组测序', samples:100, discount:0 } ],
    payments:[ { time:'2026-11-20 17:00', amount:80000, note:'首付款' } ],
    invoiceTotal:222000,
    invoices:[ { time:'2026-11-20 17:30', amount:80000, note:'' } ] },
  { id:'b6', contractId:'ct1', name:'万人基因组第二批', no:'PC20261120-002', createdAt:'2026-11-20 18:30', status:'已通过',
    items:[ { product:'全外显子组测序', samples:300, discount:5 },
            { product:'转录组测序', samples:300, discount:5 } ],
    payments:[ { time:'2026-11-21 10:00', amount:220000, note:'首付款' } ],
    invoiceTotal:270750,
    invoices:[ { time:'2026-11-21 11:00', amount:150000, note:'首期开票' } ] },
];

/* ═══════════ 状态 ═══════════ */
let customers = JSON.parse(JSON.stringify(SEED_CUSTOMERS));
let contracts = JSON.parse(JSON.stringify(SEED_CONTRACTS));
let batches   = JSON.parse(JSON.stringify(SEED_BATCHES));
let view = 'customers';   // customers | customer | batches
let param = null;
let q = '', bq = '';
let expanded = new Set(); // 客户详情里展开的合同
let draft = null;         // 新建批次草稿 { contractId, name, items }
let modalBatchId = null;  // 当前打开的批次弹窗 id
let editDraft = null;     // 批次编辑草稿 { batchId, items }

/* ═══════════ 工具函数 ═══════════ */
const $ = id => document.getElementById(id);
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const nowStr = () => { const d = new Date(); return todayStr() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const money = n => '¥' + Number(n).toLocaleString('zh-CN');
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const prodPrice = name => { const p = PRODUCTS.find(x => x.name === name); return p ? p.price : 0; };
const itemOriginal = it => prodPrice(it.product) * it.samples;
const itemCurrent  = it => Math.round(itemOriginal(it) * (1 - it.discount / 100));
function batchTotals(b){
  const samples  = b.items.reduce((a,i) => a + i.samples, 0);
  const original = b.items.reduce((a,i) => a + itemOriginal(i), 0);
  const total    = b.items.reduce((a,i) => a + itemCurrent(i), 0);
  const paid     = (b.payments || []).reduce((a,p) => a + p.amount, 0);
  return { samples, original, total, paid };
}
function nextBatchNo(){
  const d = new Date();
  const p = 'PC' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const n = batches.filter(x => x.no.startsWith(p + '-')).length + 1;
  return p + '-' + String(n).padStart(3,'0');
}
function statusBadge(s){
  const m = { '待提交':'b-blue', '待审批':'b-amber', '已通过':'b-green', '已驳回':'b-red' };
  return '<span class="badge ' + (m[s]||'b-gray') + '">' + s + '</span>';
}
function emptyRow(cols,msg){ return '<tr><td colspan="' + cols + '"><div class="empty">' + msg + '</div></td></tr>'; }
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400);
}
function showModal(html){ $('mask').innerHTML = html; $('mask').hidden = false; }
function closeModal(){ $('mask').hidden = true; $('mask').innerHTML = ''; }

/* 关联查询 */
const custOf = c => customers.find(x => x.id === c.customerId) || null;
const contractsOf = cu => contracts.filter(c => c.customerId === cu.id);
const batchesOfContract = ct => batches.filter(b => b.contractId === ct.id);
const contractOfBatch = b => contracts.find(x => x.id === b.contractId) || null;

/* ═══════════ 渲染 ═══════════ */
function navBtn(k, ico, lb){
  const active = (view === k) || (view === 'customer' && k === 'customers');
  return '<button class="nav-item ' + (active?'active':'') + '" onclick="nav(\'' + k + '\')">' + ico + ' ' + lb + '</button>';
}
function nav(k){ view = k; param = null; render(); }
function render(){ renderSidebar(); renderView(); window.scrollTo(0,0); }
function renderSidebar(){
  $('sidebar').innerHTML = navBtn('customers','👥','客户管理') + navBtn('batches','🧪','批次管理') +
    '<div class="side-foot">纯演示页面<br>数据刷新后重置</div>';
}
function renderView(){
  if (view === 'customer') viewCustomer(param);
  else if (view === 'batches') viewBatches();
  else viewCustomers();
}
function crumbHtml(parts){
  return '<div class="crumb">' + parts.map((p,i) =>
    (i === parts.length-1)
      ? '<span class="cur">' + p[1] + '</span>'
      : '<a onclick="' + p[2] + '">' + esc(p[1]) + '</a>'
  ).join('<span class="sep">›</span>') + '</div>';
}

/* ═══════════ ① 客户管理（列表） ═══════════ */
function onCustSearch(){ q = $('q').value; viewCustomers(); const el = $('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
function custStats(cu){
  const cts = contractsOf(cu);
  const bs = batches.filter(b => cts.some(c => c.id === b.contractId));
  const running = bs.filter(b => b.status === '已通过').length;   // 审批通过 → 运行中
  const paid = bs.reduce((a,b) => a + batchTotals(b).paid, 0);
  const ctotal = cts.reduce((a,c) => a + c.amount, 0);
  return { n: cts.length, running, paid, ctotal };
}

function onAiPreview(){
  const name = $('ai-product').value, samples = parseInt($('ai-samples').value) || 0, disc = parseFloat($('ai-discount').value) || 0;
  if (!name || !samples){ $('ai-preview').textContent = ''; return; }
  const original = prodPrice(name) * samples, current = Math.round(original * (1 - disc/100));
  $('ai-preview').innerHTML = '原价 <b>' + money(original) + '</b> → 现价 <b>' + money(current) + '</b>（折扣 ' + disc + '%）';
}
function readAddForm(){
  const product = $('ai-product').value, samples = parseInt($('ai-samples').value) || 0, discount = parseFloat($('ai-discount').value) || 0;
  if (!product || samples < 1){ toast('⚠️ 请选择产品并填写样本数'); return null; }
  if (discount < 0 || discount > 100){ toast('⚠️ 折扣需在 0%–100% 之间'); return null; }
  return { product, samples, discount };
}

function submitNewCustomer(e){
  e.preventDefault();
  const name = $('nc-name').value.trim(), phone = $('nc-phone').value.trim();
  if (!name || !phone){ toast('⚠️ 请填写客户姓名和电话'); return false; }
  const id = 'cu' + Date.now();
  customers.push({ id, name, phone,
    email: $('nc-email').value.trim() || '—',
    org: $('nc-org').value.trim() || '—',
    address: $('nc-addr').value.trim() || '—',
    invoice: $('nc-invoice').value.trim() || '—' });
  closeModal();
  toast('✅ 客户「' + name + '」已创建');
  openCustomer(id);
  return false;
}
function modalNewContract(customerId){
  showModal('<div class="modal"><h3>新建合同</h3>' +
    '<form onsubmit="return submitNewContract(event,\'' + customerId + '\')">' +
    '<div class="field"><label>合同名称 *</label><input id="ct-name" required placeholder="请输入合同名称"></div>' +
    '<div class="field"><label>线下合同编号</label><input id="ct-offno" placeholder="例如：HT-2026-0031"></div>' +
    '<div class="form-grid">' +
      '<div class="field"><label>金额（元）*</label><input id="ct-amount" type="number" min="0.01" step="0.01" required placeholder="例如：98000"></div>' +
      '<div class="field"><label>开始时间 *</label><input id="ct-start" type="date" required value="' + todayStr() + '"></div>' +
    '</div>' +
    '<div class="field"><label>总期限（年）*</label><input id="ct-term" type="number" min="1" step="1" value="3" required></div>' +
    '<div class="modal-actions"><button class="btn btn-primary">创建</button><button type="button" class="btn" onclick="closeModal()">取消</button></div>' +
    '</form></div>');
}
function submitNewContract(e, customerId){
  e.preventDefault();
  const name = $('ct-name').value.trim(), amount = parseFloat($('ct-amount').value);
  if (!name || !amount || amount <= 0){ toast('⚠️ 请填写合同名称和金额'); return false; }
  contracts.push({ id:'ct' + Date.now(), customerId,
    name, offlineNo: $('ct-offno').value.trim() || '—',
    amount, startDate: $('ct-start').value, termYears: parseInt($('ct-term').value) || 3 });
  closeModal();
  toast('✅ 合同「' + name + '」已创建，可点击合同后的「新建批次」');
  render();
  return false;
}
function modalPayment(batchId){
  const b = batches.find(x => x.id === batchId);
  const t = batchTotals(b);
  const left = t.total - t.paid;
  showModal('<div class="modal"><h3>申请认款</h3>' +
    '<div class="hint" style="margin-bottom:14px">批次「' + esc(b.name) + '」· 总金额 ' + money(t.total) + ' · 已认款 ' + money(t.paid) + ' · 待认款 ' + money(left) + '</div>' +
    '<form onsubmit="return submitPayment(event,\'' + batchId + '\')">' +
    '<div class="field"><label>认款金额（元）*</label><input id="pm-amount" type="number" min="0.01" step="0.01" required placeholder="例如：100000"></div>' +
    '<div class="field"><label>备注</label><input id="pm-note" placeholder="例如：首付款 / 尾款"></div>' +
    '<div class="modal-actions"><button class="btn btn-success">确认</button><button type="button" class="btn" onclick="backToBatch()">取消</button></div>' +
    '</form></div>');
}
function submitPayment(e, batchId){
  e.preventDefault();
  const b = batches.find(x => x.id === batchId);
  const amount = parseFloat($('pm-amount').value);
  if (!amount || amount <= 0){ toast('⚠️ 请输入认款金额'); return false; }
  const note = $('pm-note').value.trim();
  b.payments = b.payments || [];
  b.payments.push({ time: nowStr(), amount, note: note || '' });
  toast('💰 已认款 ' + money(amount) + '（累计 ' + money(batchTotals(b).paid) + '）');
  backToBatch();
  return false;
}
function modalInvoice(batchId){
  const b = batches.find(x => x.id === batchId);
  const t = batchTotals(b);
  const invTotal = b.invoiceTotal || t.total;
  const invUsed = (b.invoices || []).reduce((a,i) => a + i.amount, 0);
  const left = invTotal - invUsed;
  showModal('<div class="modal"><h3>申请开票</h3>' +
    '<div class="hint" style="margin-bottom:14px">批次「' + esc(b.name) + '」· 发票总额度 ' + money(invTotal) + ' · 当前额度 ' + money(invUsed) + ' · 剩余额度 ' + money(left) + '</div>' +
    '<form onsubmit="return submitInvoice(event,\'' + batchId + '\')">' +
    '<div class="field"><label>开票金额（元）*</label><input id="iv-amount" type="number" min="0.01" step="0.01" required placeholder="例如：100000"></div>' +
    '<div class="field"><label>备注</label><input id="iv-note" placeholder="例如：首批开票"></div>' +
    '<div class="modal-actions"><button class="btn btn-orange">确认</button><button type="button" class="btn" onclick="backToBatch()">取消</button></div>' +
    '</form></div>');
}
function submitInvoice(e, batchId){
  e.preventDefault();
  const b = batches.find(x => x.id === batchId);
  const amount = parseFloat($('iv-amount').value);
  if (!amount || amount <= 0){ toast('⚠️ 请输入开票金额'); return false; }
  const note = $('iv-note').value.trim();
  b.invoices = b.invoices || [];
  b.invoices.push({ time: nowStr(), amount, note: note || '' });
  toast('🧾 已申请开票 ' + money(amount) + '（当前额度累计 ' + money(b.invoices.reduce((a,i) => a + i.amount, 0)) + '）');
  backToBatch();
  return false;
}

/* ═══════════ 启动 ═══════════ */
render();
</script>
</body>
</html>
