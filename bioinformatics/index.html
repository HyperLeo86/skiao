<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯凯奥 · 生信项目中心</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#25334a;background:#f5f8fc}header{height:68px;background:white;border-bottom:1px solid #dce5f0;display:flex;align-items:center;padding:0 28px;gap:24px}.brand{font-size:20px;font-weight:700;color:#1d5da7}.logo{display:inline-grid;place-items:center;background:#2877c3;color:white;border-radius:9px;width:38px;height:38px;margin-right:10px}.tag{font-size:12px;letter-spacing:2px;color:#2a6ab5;background:#eaf3fd;padding:5px;border-radius:4px}header .right{margin-left:auto;color:#3774b6}button{font:inherit;cursor:pointer}.bar{background:linear-gradient(100deg,#215ba3,#529edf);padding:18px 30px;color:white;font-weight:600;letter-spacing:1px}.wrap{max-width:1500px;margin:36px auto;padding:0 24px}h1{font-size:22px;margin:0 0 8px}.sub{color:#788ba3;margin:0 0 26px}.card{background:white;border:1px solid #dce6f1;border-radius:10px;overflow:auto;box-shadow:0 2px 5px #203e6010}table{border-collapse:collapse;width:100%;min-width:750px;text-align:left}th{background:#f6f9fc;color:#7589a3;font-size:14px}th,td{padding:20px;border-bottom:1px solid #edf1f6}td:first-child{color:#2466b3;font-weight:600}.pill{background:#eaf3fc;color:#2468b8;padding:7px 10px;border-radius:5px;font-size:14px}.primary{background:#2464ad;color:white;border:0;border-radius:7px;padding:9px 18px}.crumb{padding:15px 24px;background:white;border-bottom:1px solid #dce5f0;color:#778ba3}.crumb button{border:0;background:none;color:#286bb4;padding:0}.layout{display:flex;min-height:calc(100vh - 119px)}aside{width:300px;flex:none;background:white;border-right:1px solid #dce5f0;padding:12px 8px;overflow:auto;max-height:calc(100vh - 119px)}.group{width:100%;border:0;background:transparent;text-align:left;padding:12px;color:#26354d;font-weight:600;border-radius:6px;display:flex;align-items:center;gap:10px}.group:hover,.child:hover{background:#f2f7fc}.count{margin-left:auto;color:#9baec5;font-size:13px}.child{display:block;width:100%;text-align:left;padding:10px 12px 10px 38px;border:0;background:transparent;color:#71849d;border-radius:6px}.child.active,.group.active{background:#e9f3fc;color:#2266b6}.arrow{display:inline-block;transition:transform .15s}.open .arrow{transform:rotate(90deg)}main{flex:1;min-width:0}.title{padding:18px 24px;background:white;border-bottom:1px solid #dce5f0;font-weight:650}.title:before{content:"";display:inline-block;width:4px;height:19px;background:#2465b0;vertical-align:middle;margin-right:10px;border-radius:2px}.empty{margin:24px;background:white;border:1px solid #e1e9f1;border-radius:10px;min-height:420px;display:grid;place-content:center;text-align:center;color:#9aacc0}.empty strong{color:#52677f;margin-bottom:8px;font-size:18px}@media(max-width:650px){header{padding:0 14px}.layout{display:block}aside{width:100%;max-height:none;border-bottom:1px solid #dce5f0}.empty{min-height:200px}.wrap{margin:24px auto}}

/* The rail reserves only its narrow handle; the expanded menu overlays the workspace. */
.layout{position:relative;display:block;padding-left:40px;min-height:calc(100vh - 119px)}
.nav-shell{position:absolute;left:0;top:0;bottom:0;width:40px;z-index:10}
.nav-panel{position:absolute;top:0;bottom:0;left:0;width:300px;transform:translateX(-260px);transition:transform .2s ease;background:#e4f1fc;box-shadow:2px 0 10px #335c8220;display:flex}
.nav-shell:hover .nav-panel,.nav-shell.expanded .nav-panel{transform:translateX(0)}
.nav-inner{width:260px;min-width:260px;height:100%;overflow-y:auto;padding:12px 8px}
.nav-handle{width:40px;flex:none;border:0;border-left:1px solid #c9e1f4;background:#d3e9fa;color:#2367a9;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;letter-spacing:3px;font-weight:700;gap:12px}
.nav-handle:hover{background:#c5e1f7}.group:hover,.child:hover{background:#d3e8f9}.child.active,.group.active{background:#c7e2f8}
main{min-width:0}.editor-frame{display:block;width:100%;height:calc(100vh - 178px);min-height:700px;border:0;background:#f4f6f8}.editor-frame[hidden],.empty[hidden]{display:none}
@media(max-width:650px){.layout{display:block;padding-left:40px}.nav-shell{width:40px}.nav-panel{width:300px}.editor-frame{height:calc(100vh - 175px);min-height:700px}}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.crumb-path{flex:1;min-width:220px}.crumb-actions{display:flex;gap:8px;flex-wrap:wrap}.crumb .crumb-actions button{border:1px solid #cbd9e8;border-radius:6px;background:#fff;color:#33465d;padding:7px 12px;transition:background .15s,color .15s,border-color .15s}.crumb .crumb-actions button:hover,.crumb .crumb-actions button:focus-visible{background:#2469b5;border-color:#2469b5;color:#fff}

.site-header{gap:36px;position:relative}.site-nav{display:flex;align-self:stretch;gap:4px}.site-nav button{border:0;background:transparent;padding:0 20px;color:#687d96;font-weight:600;border-bottom:3px solid transparent}.site-nav button:hover,.site-nav button.selected{color:#2266b6;background:#edf5fc;border-bottom-color:#3084ce}.header-actions{margin-left:auto;display:flex;align-items:center;gap:14px}.project-entry{background:#2464ad;color:white;border:0;border-radius:7px;padding:10px 17px}.user-icon{height:38px;width:38px;border-radius:50%;border:1px solid #cddded;background:#f1f7fd;color:#2568ad;font-size:20px}.home-wrap{max-width:1300px;margin:0 auto;padding:76px 28px}.home-hero{background:linear-gradient(110deg,#174d91,#438ed1);color:white;border-radius:16px;padding:60px}.home-hero h1{font-size:34px;margin:0 0 16px}.home-hero p{line-height:1.8;color:#e3f2ff}.home-hero button{margin-top:12px;background:white;color:#205da4;border:0;border-radius:7px;padding:12px 22px;font-weight:600}.home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}.home-card{padding:26px;background:white;border:1px solid #dce6f1;border-radius:10px}.home-card h2{font-size:19px}.home-card p{color:#71849d;line-height:1.7}.home-card button{border:0;background:none;color:#2464ad;padding:0;font-weight:600}[hidden]{display:none!important}@media(max-width:700px){.site-header{height:auto;min-height:68px;flex-wrap:wrap;gap:6px;padding:10px}.site-nav{order:3;width:100%;height:44px}.site-nav button{flex:1}.home-wrap{padding:24px 14px}.home-hero{padding:28px}.home-hero h1{font-size:26px}.home-cards{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><div class="brand"><span class="logo">⌁</span>斯凯奥 <span class="tag">SCALE</span></div><nav class="site-nav" aria-label="主导航"><button type="button" data-page="home" class="selected">首页</button><button type="button" data-page="cloudflow">云流程</button><button type="button" data-page="cloudtools">云工具</button></nav><div class="header-actions"><button class="project-entry" type="button">项目中心</button><button class="user-icon" type="button" aria-label="用户登录（暂未开放）" title="用户登录暂未开放">♙</button></div></header><section id="home"><div class="home-wrap"><div class="home-hero"><h1>让生信分析更简单</h1><p>从项目管理到数据分析，探索斯凯奥云端生信服务。</p><button type="button" class="home-project">进入项目中心</button></div><div class="home-cards"><div class="home-card"><h2>项目中心</h2><p>查看检测项目和分析结果，进入项目分析目录。</p><button type="button" class="home-project">查看项目</button></div><div class="home-card"><h2>云流程</h2><p>探索云端生信分析流程。</p><button type="button" data-go="cloudflow">了解云流程</button></div><div class="home-card"><h2>云工具</h2><p>使用图表与数据分析工具。</p><button type="button" data-go="cloudtools">了解云工具</button></div></div></div></section><section id="placeholder" hidden><div class="bar" id="placeholderBar"></div><div class="wrap"><div class="empty"><strong id="placeholderTitle"></strong><span>页面内容待建设</span></div></div></section><section id="list" hidden><div class="bar">项目中心　/　PROJECT CENTER</div><div class="wrap"><h1>项目列表</h1><p class="sub">选择检测项目，进入分析目录</p><div class="card"><table><thead><tr><th>项目编号</th><th>项目名称</th><th>产品</th><th>备注</th><th>操作</th></tr></thead><tbody><tr><td>P2024-001</td><td>水稻盐胁迫转录组分析</td><td><span class="pill">真核有参转录组测序</span></td><td>示例项目</td><td><button class="primary" id="enter">进入分析</button></td></tr></tbody></table></div></div></section><section id="detail" hidden><div class="crumb"><div class="crumb-path"><button id="back">项目中心</button>　/　P2024-001　/　<span id="path">项目概览</span></div><div class="crumb-actions"><button type="button">项目重分析</button><button type="button">项目报告</button><button type="button">数据下载</button></div></div><div class="layout"><div class="nav-shell" id="navShell"><div class="nav-panel"><nav class="nav-inner" id="nav" aria-label="分析目录"></nav><button class="nav-handle" id="navToggle" type="button" aria-label="展开分析目录" aria-expanded="false">☰ 目录</button></div></div><main><div class="title" id="title">项目概览</div><div class="empty"><strong id="emptyTitle">项目概览</strong><span>页面内容待建设</span></div><iframe id="heatmap" class="editor-frame" title="热图编辑器" src="../heatmap-editor/index.html?v=20261123" hidden></iframe></main></div></section><script>function showPage(page){for(const id of ['home','list','detail','placeholder'])document.getElementById(id).hidden=true;const target=page==='project'?'list':(['cloudflow','cloudtools'].includes(page)?'placeholder':page);document.getElementById(target).hidden=false;document.querySelectorAll('.site-nav button').forEach(b=>b.classList.toggle('selected',b.dataset.page===page));if(target==='placeholder'){const label=page==='cloudflow'?'云流程':'云工具';document.querySelector('#placeholderBar').textContent=label;document.querySelector('#placeholderTitle').textContent=label}}document.querySelectorAll('.site-nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.querySelectorAll('.project-entry,.home-project').forEach(b=>b.onclick=()=>showPage('project'));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showPage(b.dataset.go));const data={"结题报告": [], "项目概览": [], "项目管理": ["基因集管理", "样本分组管理"], "测序数据质控": ["质控统计（碱基质量）", "质控汇总"], "参考基因组比对": ["比对结果汇总"], "功能注释": ["功能注释详情"], "表达定量": ["表达量统计汇总", "表达量矩阵", "测序饱和度评估", "测序随机性评估", "样本间相关性分析", "样本间PCA分析"], "差异表达分析": ["两组间差异表达分析", "两组间差异统计汇总", "多组差异分析"], "富集分析": ["GO富集分析", "KEGG富集分析", "GSEA富集分析"], "蛋白互作网络分析": ["PPI 子网络"], "基因转录因子预测": [], "基因结构分析": ["可变剪接分析（rMATS）", "SNP/Indel 变异检测", "lncRNA 预测（CPAT 等）"]};const nav=document.querySelector('#nav');function select(name,button){const shell=document.querySelector('#navShell');shell.classList.remove('expanded');document.querySelector('#navToggle').setAttribute('aria-expanded','false');document.querySelector('#navToggle').setAttribute('aria-label','展开分析目录');document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));button.classList.add('active');const heatmap=name==='热图编辑器';const frame=document.querySelector('#heatmap');frame.hidden=!heatmap;document.querySelector('.empty').hidden=heatmap;for(const id of ['title','path','emptyTitle'])document.getElementById(id).textContent=name}for(const [group,children] of Object.entries(data)){const container=document.createElement('div');const b=document.createElement('button');b.className='group';b.innerHTML='<span class="arrow">›</span><span></span><span class="count"></span>';b.children[1].textContent=group;b.children[2].textContent=children.length||'';container.appendChild(b);const sub=document.createElement('div');sub.hidden=true;for(const name of children){const c=document.createElement('button');c.className='child';c.textContent=name;c.onclick=()=>select(name,c);sub.appendChild(c)}container.appendChild(sub);b.setAttribute('aria-expanded','false');b.onclick=()=>{if(children.length){sub.hidden=!sub.hidden;container.classList.toggle('open',!sub.hidden);b.setAttribute('aria-expanded',String(!sub.hidden))}else select(group,b)};nav.appendChild(container)}const heatButton=document.createElement('button');heatButton.className='group';heatButton.innerHTML='<span class="arrow">◇</span><span>热图编辑器</span>';heatButton.onclick=()=>select('热图编辑器',heatButton);nav.appendChild(heatButton);const shell=document.querySelector('#navShell'),toggle=document.querySelector('#navToggle');toggle.onclick=()=>{const open=shell.classList.toggle('expanded');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'收起分析目录':'展开分析目录')};shell.addEventListener('keydown',e=>{if(e.key==='Escape'){shell.classList.remove('expanded');toggle.setAttribute('aria-expanded','false');toggle.focus()}});document.querySelector('#enter').onclick=()=>{document.querySelector('#list').hidden=true;document.querySelector('#detail').hidden=false;select('项目概览',Array.from(document.querySelectorAll('.group')).find(x=>x.children[1].textContent==='项目概览'))};document.querySelector('#back').onclick=()=>{document.querySelector('#detail').hidden=true;document.querySelector('#list').hidden=false};</script></body></html>
