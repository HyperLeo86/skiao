<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyAO · 参数编辑器</title>
  <link rel="stylesheet" href="/web/parameters.css">
  <script type="module" src="/web/parameters.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/demo" aria-label="SkyAO 工作台">
      <span class="brand-mark" data-icon="layers"></span><span>SkyAO<small>生信工作台</small></span>
    </a>
    <nav aria-label="工作区">
      <a href="/demo" class="workspace-link">接收测试</a>
      <a href="/demo/transfer" class="workspace-link">文件投送追踪</a>
      <a href="/demo/parameters" aria-current="page">参数编辑器</a>
    </nav>
    <span class="workspace"><i></i> 本地工作区</span>
  </header>
  <main class="shell">
    <div class="page-head">
      <div>
        <div class="crumb">生信工作台 <span data-icon="chevron"></span> 参数库</div>
        <h1>参数编辑器</h1>
        <p>登记分析参数，预览填写方式与提交数据，确认后供流程节点选用。</p>
      </div>
      <button class="btn" id="export-library"><span data-icon="download"></span> 导出参数总表</button>
    </div>
    <div class="workspace-grid">
      <aside class="panel library" aria-labelledby="library-heading">
        <div class="library-heading">
          <span class="icon-box" data-icon="library"></span>
          <h2 id="library-heading">参数库</h2><span id="library-count" class="count">…</span>
        </div>
        <button class="btn primary new-button" id="new-card"><span data-icon="plus"></span> 新增参数</button>
        <div class="filters">
          <label class="search"><span data-icon="search"></span><input id="search" type="search" aria-label="搜索参数名称或代码" placeholder="搜索名称或代码"></label>
          <div class="filter-row">
            <select id="type-filter" aria-label="筛选类型">
              <option value="">全部类型</option><option value="number">数值</option><option value="choice">固定选项</option>
              <option value="project">项目对象</option><option value="text">文本</option>
            </select>
            <select id="status-filter" aria-label="筛选状态">
              <option value="">全部状态</option><option value="draft">草稿</option><option value="pending">待确认</option><option value="confirmed">已确认</option>
            </select>
          </div>
        </div>
        <div class="list-heading"><span>参数卡片</span><span id="match-count"></span></div>
        <div id="card-list" aria-label="参数卡片"></div>
        <div class="library-foot"><span data-icon="info"></span> 确认后的参数可供节点选用</div>
      </aside>
      <section class="workbench" aria-label="参数编辑工作区">
        <header class="panel workbench-head">
          <div class="selected">
            <span id="selected-icon" class="selected-icon" data-icon="number"></span>
            <div>
              <div class="selected-title"><h2 id="selected-name">载入参数…</h2><span id="selected-status"></span></div>
              <div class="selected-meta" id="selected-meta"></div>
            </div>
          </div>
          <div class="head-actions" id="head-actions"></div>
        </header>
        <div id="load-error" class="panel load-error" hidden></div>
        <div class="detail-grid" id="detail" hidden>
          <section class="panel editor" aria-labelledby="editor-heading">
            <div class="panel-head">
              <span class="icon-box" data-icon="edit"></span>
              <div><h2 id="editor-heading">参数定义</h2><p>设置填写规则与默认值</p></div>
            </div>
            <div id="definition"></div>
          </section>
          <aside class="preview-column" aria-labelledby="preview-heading">
            <section class="panel preview">
              <div class="panel-head">
                <span class="icon-box" data-icon="eye"></span>
                <div><h2 id="preview-heading">实时预览</h2><p>试填参数并核对提交数据</p></div>
              </div>
              <div class="preview-body">
                <div class="section-caption"><span data-icon="form"></span> 填写效果</div>
                <div id="form-preview" class="mock-form"></div>
                <div id="payload" class="code-card">
                  <div class="code-head">
                    <div class="code-tabs" aria-label="JSON 内容">
                      <button class="code-tab" data-tab="payload" aria-pressed="true">提交示例</button>
                      <button class="code-tab" data-tab="definition" aria-pressed="false">参数定义</button>
                    </div>
                    <button class="code-copy" id="copy-json" title="复制 JSON" aria-label="复制 JSON"><span data-icon="copy"></span></button>
                  </div>
                  <pre><code id="json-preview"></code></pre>
                </div>
                <div id="validation" class="validation" aria-live="polite"></div>
              </div>
            </section>
            <div class="preview-note"><span data-icon="info"></span><span>预览中的试填值仅用于核对。默认值在左侧单独设置。</span></div>
          </aside>
        </div>
        <footer class="workflow" id="workflow" hidden>
          <div id="workflow-status" role="status"></div><div id="workflow-actions"></div>
        </footer>
      </section>
    </div>
  </main>
  <dialog id="review-dialog">
    <form method="dialog" id="review-form">
      <div class="dialog-header"><span class="icon-box" data-icon="check"></span><div><h2>确认入库</h2><p id="review-target"></p></div></div>
      <fieldset><legend>请逐项核对</legend>
        <label><input type="checkbox" required> 参数名称和用途准确</label>
        <label><input type="checkbox" required> 参数、选项和子项代码与接收程序一致</label>
        <label><input type="checkbox" required> 数值类型、单位、边界和组合检查明确</label>
        <label><input type="checkbox" required> 已核对默认值或确认无需默认值</label>
        <label><input type="checkbox" required> 接收程序可以理解示例中的数据形态</label>
      </fieldset>
      <div class="dialog-actions"><button type="button" class="btn" id="cancel-review">返回</button><button class="btn primary" type="submit">确认入库</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
