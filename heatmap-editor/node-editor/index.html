<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyAO · 节点编辑器</title>
  <link rel="stylesheet" href="../parameter-editor/parameters.css">
  <link rel="stylesheet" href="./nodes.css">
  <script type="module" src="./nodes.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="../parameter-editor/" aria-label="SkyAO 工作台">
      <span class="brand-mark" data-icon="layers"></span><span>SkyAO<small>生信工作台</small></span>
    </a>
    <nav aria-label="工作区">
      <a href="../parameter-editor/">参数编辑器</a>
      <a href="./" aria-current="page">节点编辑器</a>
    </nav>
    <span class="workspace"><i></i> 数据保存在此浏览器</span>
  </header>
  <main class="shell">
    <div class="page-head">
      <div>
        <div class="crumb">生信工作台 <span data-icon="chevron"></span> 节点库</div>
        <h1>节点编辑器</h1>
        <p>登记节点结果与重分析配置，确认后供云流程选用。</p>
      </div>
      <button class="btn" id="export-library"><span data-icon="download"></span> 导出节点总表</button>
    </div>
    <div class="workspace-grid">
      <aside class="panel library" aria-labelledby="library-heading">
        <div class="library-heading">
          <span class="icon-box" data-icon="library"></span>
          <h2 id="library-heading">节点库</h2><span id="library-count" class="count">…</span>
        </div>
        <button class="btn primary new-button" id="new-card"><span data-icon="plus"></span> 新增节点</button>
        <div class="filters">
          <label class="search"><span data-icon="search"></span><input id="search" type="search" aria-label="搜索节点名称或 ID" placeholder="搜索名称或 ID"></label>
          <div class="filter-row">
            <select id="status-filter" aria-label="筛选状态">
              <option value="">全部状态</option><option value="draft">草稿</option><option value="pending">待确认</option><option value="confirmed">已确认</option>
            </select>
          </div>
        </div>
        <div class="list-heading"><span>节点列表</span><span id="match-count"></span></div>
        <div id="card-list" aria-label="节点列表"></div>
        <div class="library-foot"><span data-icon="info"></span> 确认后的节点可供云流程选用</div>
      </aside>
      <section class="workbench" aria-label="节点编辑工作区">
        <header class="panel workbench-head">
          <div class="selected">
            <span id="selected-icon" class="selected-icon" data-icon="layers"></span>
            <div>
              <div class="selected-title"><h2 id="selected-name">载入节点…</h2><span id="selected-status"></span></div>
              <div class="selected-meta" id="selected-meta"></div>
            </div>
          </div>
          <div class="head-actions" id="head-actions"></div>
        </header>
        <div id="load-error" class="panel load-error" hidden></div>
        <div class="detail-grid" id="detail" hidden>
          <section class="panel editor" aria-labelledby="editor-heading">
            <div class="panel-head">
              <span class="icon-box" data-icon="edit"></span>
              <div><h2 id="editor-heading">节点定义</h2><p>配置结果与重分析入口</p></div>
            </div>
            <div id="definition"></div>
          </section>
          <aside class="preview-column" aria-labelledby="preview-heading">
            <section class="panel preview">
              <div class="panel-head">
                <span class="icon-box" data-icon="eye"></span>
                <div><h2 id="preview-heading">实时预览</h2><p>查看结果、试填参数和核对定义</p></div>
              </div>
              <div class="preview-body">
                <div class="segments node-preview-tabs" aria-label="预览视图">
                  <button type="button" data-tab="results" aria-pressed="true">节点展示</button>
                  <button type="button" data-tab="trial" aria-pressed="false">重分析试填</button>
                  <button type="button" data-tab="definition" aria-pressed="false">节点定义 JSON</button>
                </div>
                <div id="preview-content" class="node-preview-stack"></div>
                <div id="validation" class="validation" aria-live="polite"></div>
              </div>
            </section>
          </aside>
        </div>
        <footer class="workflow" id="workflow" hidden>
          <div id="workflow-status" role="status"></div><div id="workflow-actions"></div>
        </footer>
      </section>
    </div>
  </main>
  <dialog id="review-dialog">
    <form method="dialog" id="review-form">
      <div class="dialog-header"><span class="icon-box" data-icon="check"></span><div><h2>确认入库</h2><p id="review-target"></p></div></div>
      <fieldset><legend>请逐项核对</legend>
        <label><input type="checkbox" required> 已核对名称、结果编号和展示顺序</label>
        <label><input type="checkbox" required> 已核对渲染图的来源表格、候选脚本与默认脚本</label>
        <label><input type="checkbox" required> 已核对重分析入口和引用的参数版本</label>
      </fieldset>
      <div class="dialog-actions"><button type="button" class="btn" id="cancel-review">返回</button><button class="btn primary" type="submit">确认入库</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
