<style>
:root{--ink:#17222d;--muted:#72808c;--line:#e5eaf0;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:18px}.brand{font-weight:750;font-size:18px}.brand i{display:inline-block;width:24px;height:24px;background:linear-gradient(135deg,#1769aa,#43aa8b);border-radius:7px;vertical-align:-6px;margin-right:8px}.crumb,.topright{color:var(--muted);font-size:13px}.topright{margin-left:auto;display:flex;align-items:center;gap:10px}.btn{border:1px solid #d6dee7;border-radius:8px;background:white;padding:9px 13px;color:#263745;font:inherit;cursor:pointer}.btn:hover{background:#f3f7fa}.btn.primary{background:#1769aa;color:white;border-color:#1769aa}.btn.primary:hover{background:#12598f}.workspace{height:820px;min-height:700px;display:grid;grid-template-columns:310px minmax(420px,1fr) 280px;gap:14px;padding:14px;max-width:1800px;margin:auto}.side,.center{background:white;border:1px solid var(--line);border-radius:12px;min-height:0}.side{overflow:auto}.sidehead{padding:15px 17px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:2}.sidehead b{font-size:16px}.sidehead small{display:block;color:var(--muted);margin-top:4px}.section{border-bottom:1px solid var(--line)}.section summary{list-style:none;cursor:pointer;padding:13px 16px;background:#f6f8fa;font-weight:650;display:flex;justify-content:space-between}.section summary:after{content:'⌄';color:#71808d}.fields{padding:12px 15px;display:grid;gap:12px}.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}.field label small{font-weight:400;color:#98a3ad}.field input[type=text],.field input[type=number],select{width:100%;border:1px solid #dce3e9;border-radius:7px;padding:8px 9px;font:inherit;color:#293743;background:white}.field input[type=color]{width:100%;height:37px;border:1px solid #dce3e9;border-radius:7px;background:white;padding:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{font-size:13px;display:flex;align-items:center;gap:7px;color:#3d4b56}.check input{accent-color:#1769aa}.drop{border:1px dashed #c7d4df;border-radius:9px;padding:15px 10px;text-align:center;color:#476275;background:#f8fbfd}.drop strong{display:block;font-size:13px}.drop small{display:block;color:#8b98a2;margin-top:4px}.drop input{width:100%;margin-top:10px;font-size:12px}.center{display:flex;flex-direction:column;overflow:hidden}.figurehead{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.badge{font-size:11px;background:#eaf4f9;color:#34728b;border-radius:20px;padding:4px 9px}.figuretools{margin-left:auto}.canvaswrap{padding:18px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:#fbfcfd}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 2px 12px #15263814}.figurefoot{padding:11px 17px;border-top:1px solid var(--line);color:#788591;font-size:12px;display:flex;justify-content:space-between}.hint{font-size:12px;color:#7c8993;line-height:1.5;margin:0}hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}.footerbtn{padding:13px 15px;position:sticky;bottom:0;background:white;border-top:1px solid var(--line);display:flex;gap:8px}.footerbtn .btn{flex:1}#status{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:1150px){.workspace{grid-template-columns:280px 1fr}.right{display:none}}@media(max-width:760px){.workspace{height:auto;display:flex;flex-direction:column}.center{height:620px;order:-1}.controls,.right{display:block;max-height:none}.crumb{display:none}.topright{gap:5px}.topright span{display:none}}

<body>
<header class="top"><div class="brand"><i></i>BioPlot</div><div class="crumb">生信图表工具　/　热图编辑器</div><div class="topright"><span id="status">示例数据已载入</span><button class="btn" id="reset">恢复默认</button><button class="btn primary" id="export">导出 PNG</button></div></header>
<main class="workspace">
<aside class="side controls"><div class="sidehead"><b>图形设置</b><small>修改参数，预览同步更新</small></div>
<details class="section" open><summary>画布</summary><div class="fields"><div class="pair"><div class="field"><label>宽度 <small>像素</small></label><input data-p="width" type="number" min="500" max="5000" step="100" value="1400"></div><div class="field"><label>高度 <small>像素</small></label><input data-p="height" type="number" min="400" max="5000" step="100" value="1000"></div></div><div class="pair"><div class="field"><label>上边距</label><input data-p="top" type="number" min="0" max="400" value="70"></div><div class="field"><label>下边距</label><input data-p="bottom" type="number" min="0" max="400" value="100"></div></div><div class="pair"><div class="field"><label>左边距</label><input data-p="left" type="number" min="0" max="500" value="150"></div><div class="field"><label>右边距</label><input data-p="right" type="number" min="0" max="500" value="60"></div></div><div class="field"><label>背景颜色</label><input data-p="background" type="color" value="#ffffff"></div></div></details>
<details class="section" open><summary>配色方案</summary><div class="fields"><div class="field"><label>预设配色</label><select id="preset"><option value="default">蓝 - 白 - 红（默认）</option><option value="sunset">紫 - 白 - 橙</option><option value="green">绿 - 白 - 紫</option><option value="ice">蓝 - 浅灰 - 红</option></select></div><div class="pair"><div class="field"><label>低值颜色</label><input data-p="low" type="color" value="#377eb8"></div><div class="field"><label>中间颜色</label><input data-p="mid" type="color" value="#ffffff"></div></div><div class="field"><label>高值颜色</label><input data-p="high" type="color" value="#e41a1c"></div><div class="field"><label>渐变色阶数</label><input data-p="steps" type="number" min="3" max="256" value="50"></div><div class="field"><label>缺失值颜色</label><input data-p="na" type="color" value="#bebebe"></div><div class="pair"><div class="field"><label>格子边框颜色</label><input data-p="borderColor" type="color" value="#ffffff"></div><div class="field"><label>边框宽度</label><input data-p="borderWidth" type="number" min="0" max="10" step="0.5" value="1"></div></div></div></details>
<details class="section" open><summary>标题与字体</summary><div class="fields"><div class="field"><label>标题</label><input data-p="title" type="text" value="蛋白表达模式热图"></div><div class="field"><label>字体</label><select data-p="font"><option>Arial</option><option>Times New Roman</option><option>Helvetica</option><option>Georgia</option></select></div><div class="pair"><div class="field"><label>标题字号</label><input data-p="titleSize" type="number" min="8" max="96" value="30"></div><div class="field"><label>标签字号</label><input data-p="labelSize" type="number" min="6" max="48" value="15"></div></div><div class="field"><label>标题颜色</label><input data-p="textColor" type="color" value="#26323d"></div><div class="pair"><label class="check"><input data-p="bold" type="checkbox" checked>标题加粗</label><label class="check"><input data-p="showTitle" type="checkbox" checked>显示标题</label></div></div></details>
<details class="section"><summary>坐标轴与标签</summary><div class="fields"><div class="pair"><label class="check"><input data-p="showRows" type="checkbox" checked>显示蛋白 ID</label><label class="check"><input data-p="showCols" type="checkbox" checked>显示样本名</label></div><div class="field"><label>样本名角度</label><select data-p="angle"><option value="0">0°</option><option value="45" selected>45°</option><option value="90">90°</option></select></div><div class="field"><label>标签字号</label><input data-p="labelSize" type="number" min="6" max="48" value="15"></div></div></details>
<details class="section"><summary>聚类与标准化</summary><div class="fields"><div class="pair"><label class="check"><input data-p="clusterRows" type="checkbox" checked>行聚类</label><label class="check"><input data-p="clusterCols" type="checkbox" checked>列聚类</label></div><div class="field"><label>标准化方式</label><select data-p="scale"><option value="row_zscore">按行 Z-score</option><option value="none">不标准化</option><option value="row_minmax">按行 Min-Max</option></select></div><div class="field"><label>距离度量</label><select data-p="distance"><option>euclidean</option><option>manhattan</option><option>correlation</option></select></div><div class="field"><label>聚类方法</label><select data-p="method"><option>complete</option><option>average</option><option>single</option></select></div><label class="check"><input data-p="dropConstant" type="checkbox" checked>移除恒定行</label><p class="hint">本原型使用浏览器端层次聚类；超大矩阵请先用筛选后的数据测试。</p></div></details>
<details class="section"><summary>图例</summary><div class="fields"><label class="check"><input data-p="showLegend" type="checkbox" checked>显示图例</label><div class="field"><label>图例标题</label><input data-p="legendTitle" type="text" value="Row Z-score"></div></div></details>
</aside>
<section class="center"><div class="figurehead"><strong>图片预览</strong><span class="badge" id="dimensions">16 行 × 12 列</span><div class="figuretools"><button class="btn" id="fit">适合窗口</button></div></div><div class="canvaswrap"><canvas id="plot" width="1400" height="1000"></canvas></div><div class="figurefoot"><span id="summary">行 Z-score · 欧氏距离 · complete 聚类</span><span>PNG 高清导出</span></div></section>
<aside class="side right"><div class="sidehead"><b>数据与导出</b><small>本地处理，文件不会上传</small></div><div class="fields"><div class="drop"><strong>导入表达矩阵</strong><small>首列蛋白 ID，其余列为样本</small><input id="file" type="file" accept=".tsv,.csv,.txt"></div><button class="btn" id="demo">载入示例数据</button><div class="field"><label>比较组标签</label><input data-p="label" type="text" value="Control_vs_Treatment"></div><hr><div class="field"><label>导出格式</label><input type="text" value="PNG" disabled></div><div class="field"><label>PNG 分辨率</label><select data-p="dpi"><option value="1">标准预览（1×）</option><option value="2" selected>高清（2×）</option><option value="3">印刷（3×）</option></select></div><p class="hint">导出尺寸按画布像素 × 分辨率倍率生成。上传数据和计算均在浏览器本地完成。</p></div><div class="footerbtn"><button class="btn" id="reset2">重置设置</button><button class="btn primary" id="export2">导出 PNG</button></div></aside>
</main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let matrix=[],rowIds=[],colIds=[],filename='heatmap';
const demo=`Protein\tControl_01\tControl_02\tControl_03\tTreatA_01\tTreatA_02\tTreatA_03\tTreatB_01\tTreatB_02\tTreatB_03\tRescue_01\tRescue_02\tRescue_03\nALB\t4.1\t4.0\t4.2\t2.8\t2.7\t2.9\t1.9\t2.1\t2.0\t3.4\t3.5\t3.3\nAPOA1\t3.4\t3.6\t3.5\t2.5\t2.4\t2.6\t1.2\t1.3\t1.4\t2.9\t2.8\t3.0\nACTB\t2.2\t2.1\t2.3\t2.2\t2.1\t2.3\t2.2\t2.1\t2.3\t2.2\t2.1\t2.3\nGAPDH\t1.7\t1.8\t1.6\t2.8\t2.7\t2.9\t3.3\t3.4\t3.2\t2.1\t2.0\t2.2\nHSP90AA1\t1.2\t1.1\t1.3\t2.6\t2.7\t2.5\t3.2\t3.1\t3.3\t1.9\t2.0\t1.8\nEEF1A1\t2.1\t2.0\t2.2\t2.8\t2.9\t2.7\t3.4\t3.3\t3.5\t2.4\t2.3\t2.5\nVIM\t1.1\t1.2\t1.0\t2.8\t2.9\t2.7\t3.7\t3.6\t3.8\t2.1\t2.2\t2.0\nTP53\t2.0\t2.1\t1.9\t3.0\t2.9\t3.1\t3.4\t3.5\t3.3\t2.6\t2.5\t2.7\nMYC\t1.2\t1.3\t1.1\t3.1\t3.0\t3.2\t3.7\t3.8\t3.6\t2.3\t2.4\t2.2\nEGFR\t1.5\t1.4\t1.6\t2.9\t3.0\t2.8\t3.6\t3.5\t3.7\t2.4\t2.3\t2.5\nCDK1\t1.0\t1.1\t0.9\t2.7\t2.8\t2.6\t3.5\t3.6\t3.4\t2.2\t2.1\t2.3\nJUN\t1.4\t1.3\t1.5\t3.0\t2.9\t3.1\t3.4\t3.3\t3.5\t2.5\t2.6\t2.4\nSTAT3\t1.6\t1.5\t1.7\t2.8\t2.7\t2.9\t3.5\t3.4\t3.6\t2.4\t2.5\t2.3\nFOS\t1.0\t1.1\t0.9\t3.1\t3.2\t3.0\t3.8\t3.7\t3.9\t2.3\t2.4\t2.2\nHIF1A\t1.2\t1.1\t1.3\t2.7\t2.8\t2.6\t3.6\t3.7\t3.5\t2.2\t2.1\t2.3\nGSK3B\t2.3\t2.2\t2.4\t2.4\t2.5\t2.3\t1.4\t1.5\t1.3\t2.2\t2.1\t2.3`;
function setDemo(){parse(demo,'demo_heatmap.tsv')}
function parse(text,name){let lines=text.trim().split(/\r?\n/).filter(Boolean),sep=lines[0].includes('\t')?'\t':',';let rows=lines.map(l=>l.split(sep).map(x=>x.trim()));if(rows.length<3||rows[0].length<3)throw Error('至少需要两行蛋白和两列样本。');let w=rows[0].length;if(rows.some(r=>r.length!==w))throw Error('数据列数不一致，请检查文件分隔符。');colIds=rows[0].slice(1);rowIds=rows.slice(1).map(r=>r[0]);matrix=rows.slice(1).map((r,i)=>r.slice(1).map((v,j)=>{let n=Number(v);if(v===''||v.toLowerCase()==='na'||v.toLowerCase()==='nan')return NaN;if(!Number.isFinite(n))throw Error(`第 ${i+2} 行、第 ${j+2} 列不是数值。`);return n}));filename=(name||'heatmap').replace(/\.[^.]+$/,'');$('#dimensions').textContent=`${matrix.length} 行 × ${colIds.length} 列` ;draw()}
function val(k){let e=$(`[data-p="${k}"]`);return e?.type==='checkbox'?e.checked:e?.type==='number'?Number(e.value):e?.value}
function norm(data){let method=val('scale');return data.map(row=>{let good=row.filter(Number.isFinite);if(!good.length)return row.map(()=>NaN);if(method==='none')return row.slice();if(method==='row_minmax'){let lo=Math.min(...good),hi=Math.max(...good);return row.map(x=>Number.isFinite(x)?(hi===lo?NaN:(x-lo)/(hi-lo)):NaN)}let mean=good.reduce((a,b)=>a+b,0)/good.length,sd=Math.sqrt(good.reduce((s,x)=>s+(x-mean)**2,0)/(good.length-1||1));return row.map(x=>Number.isFinite(x)?(sd===0?NaN:(x-mean)/sd):NaN)})}
function dist(a,b){let pairs=a.map((x,i)=>[x,b[i]]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(!pairs.length)return Infinity;let d=val('distance');if(d==='manhattan')return pairs.reduce((s,p)=>s+Math.abs(p[0]-p[1]),0);if(d==='correlation'){let ma=pairs.reduce((s,p)=>s+p[0],0)/pairs.length,mb=pairs.reduce((s,p)=>s+p[1],0)/pairs.length,n=0,x=0,y=0;pairs.forEach(p=>{n+=(p[0]-ma)*(p[1]-mb);x+=(p[0]-ma)**2;y+=(p[1]-mb)**2});return 1-n/(Math.sqrt(x*y)||1)}return Math.sqrt(pairs.reduce((s,p)=>s+(p[0]-p[1])**2,0))}
function clusterOrder(data){let groups=data.map((_,i)=>[i]);while(groups.length>1){let best=[0,1,Infinity];for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){let ds=[];for(let a of groups[i])for(let b of groups[j])ds.push(dist(data[a],data[b]));let d=val('method')==='single'?Math.min(...ds):val('method')==='average'?ds.reduce((a,b)=>a+b,0)/ds.length:Math.max(...ds);if(d<best[2])best=[i,j,d]}let [i,j]=best;groups[i]=groups[i].concat(groups[j]);groups.splice(j,1)}return groups[0]}
function processed(){let d=norm(matrix),ids=rowIds.slice(),cols=colIds.map((_,i)=>i);if(val('dropConstant')){let keep=d.map((r,i)=>r.some(Number.isFinite)?i:-1).filter(i=>i>=0);d=keep.map(i=>d[i]);ids=keep.map(i=>ids[i])}if(val('clusterRows')&&d.length>1){let o=clusterOrder(d);d=o.map(i=>d[i]);ids=o.map(i=>ids[i])}if(val('clusterCols')&&cols.length>1){let o=clusterOrder(d[0].map((_,c)=>d.map(r=>r[c])));cols=o}return {d,ids,cols}}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}function mix(a,b,t){a=hex(a);b=hex(b);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')}function color(v,min,max){if(!Number.isFinite(v))return val('na');let t=Math.max(0,Math.min(1,(v-min)/(max-min||1)));return t<.5?mix(val('low'),val('mid'),t*2):mix(val('mid'),val('high'),(t-.5)*2)}
function draw(){if(!matrix.length)return;let {d,ids,cols}=processed(),canvas=$('#plot'),ctx=canvas.getContext('2d'),w=Math.max(500,Math.min(5000,val('width')||1400)),h=Math.max(400,Math.min(5000,val('height')||1000));canvas.width=w;canvas.height=h;ctx.fillStyle=val('background');ctx.fillRect(0,0,w,h);let font=val('font'),title=val('title'),l=val('showRows')?Math.min(val('left'),Math.floor(w*.35)):Math.min(val('left'),30),r=Math.min(val('right'),Math.floor(w*.25)),top=val('top'),bottom=val('bottom')+(val('showCols')?val('labelSize')*3:0)+(val('showLegend')?70:0);if(val('showTitle')){ctx.textAlign='center';ctx.fillStyle=val('textColor');ctx.font=`${val('bold')?'bold ':''}${val('titleSize')}px ${font}`;ctx.fillText(title,w/2,Math.max(24,top*.62),w-l-r)}let x0=l,y0=top,cw=(w-l-r)/cols.length,ch=Math.max(1,(h-y0-bottom)/d.length),all=d.flat().filter(Number.isFinite),min=Math.min(...all),max=Math.max(...all);if(val('scale')==='row_zscore'){min=-2;max=2}else if(val('scale')==='row_minmax'){min=0;max=1}ctx.lineWidth=val('borderWidth');ctx.strokeStyle=val('borderColor');for(let i=0;i<d.length;i++){if(ch<.7)break;for(let j=0;j<cols.length;j++){let v=d[i][cols[j]],x=x0+j*cw,y=y0+i*ch;ctx.fillStyle=color(v,min,max);ctx.fillRect(x,y,Math.ceil(cw),Math.ceil(ch));if(val('borderWidth')>0&&cw>4&&ch>4)ctx.strokeRect(x,y,cw,ch)}}ctx.fillStyle=val('textColor');ctx.font=`${val('labelSize')}px ${font}`;if(val('showRows')&&ch>4){ctx.textAlign='right';for(let i=0;i<ids.length;i++){if(ch<14&&i%Math.ceil(14/ch)!==0)continue;ctx.fillText(ids[i],x0-8,y0+(i+.65)*ch,l-12)}}if(val('showCols')){ctx.textAlign='left';let angle=Number(val('angle'))*Math.PI/180;for(let j=0;j<cols.length;j++){ctx.save();ctx.translate(x0+(j+.5)*cw,y0+d.length*ch+10);ctx.rotate(angle);ctx.fillText(colIds[cols[j]],0,0);ctx.restore()}}if(val('showLegend')){let gy=h-Math.max(32,Number(val('bottom'))*.45),gw=Math.min(260,w*.32),gx=(w-gw)/2;for(let k=0;k<gw;k++)ctx.fillStyle=color(min+(max-min)*k/gw,min,max),ctx.fillRect(gx+k,gy,1,14);ctx.fillStyle='#46535e';ctx.textAlign='center';ctx.font=`${Math.max(10,val('labelSize')-2)}px ${font}`;ctx.fillText(val('legendTitle')||'表达量',w/2,gy-7);ctx.textAlign='left';ctx.fillText(String(Number(min.toFixed(2))),gx,gy+30);ctx.textAlign='right';ctx.fillText(String(Number(max.toFixed(2))),gx+gw,gy+30)}$('#summary').textContent=`${val('scale')} · ${val('distance')} 距离 · ${val('method')} 聚类`;$('#dimensions').textContent=`${d.length} 行 × ${cols.length} 列`}
function showError(e){$('#status').textContent=e.message;$('#status').classList.add('error')}
$('#file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{parse(await f.text(),f.name);$('#status').textContent=`已载入 ${f.name}`;$('#status').classList.remove('error')}catch(err){showError(err)}});
$$('[data-p]').forEach(el=>el.addEventListener('input',()=>{if(el.dataset.p==='low'||el.dataset.p==='mid'||el.dataset.p==='high')$('#preset').value='custom';draw()}));
$('#preset').addEventListener('change',e=>{let p={default:['#377eb8','#ffffff','#e41a1c'],sunset:['#7655a6','#ffffff','#f08a32'],green:['#159b79','#ffffff','#8b4ba8'],ice:['#284b83','#f5f5f5','#ef6a55']}[e.target.value];if(p){['low','mid','high'].forEach((k,i=>$(`[data-p="${k}"]`).value=p[i]));draw()}});
function exportPng(){try{draw();let c=$('#plot'),scale=Number(val('dpi'))||2,out=document.createElement('canvas');out.width=c.width*scale;out.height=c.height*scale;out.getContext('2d').drawImage(c,0,0,out.width,out.height);out.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${filename}.heatmap.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('#status').textContent=`已导出 ${a.download}`},'image/png')}catch(e){showError(e)}}$('#export').onclick=$('#export2').onclick=exportPng;
function reset(){ $$('[data-p]').forEach(e=>{if(e.type==='checkbox')e.checked=['bold','showTitle','showRows','showCols','clusterRows','clusterCols','dropConstant','showLegend'].includes(e.dataset.p);else if(e.dataset.p==='width')e.value=1400;else if(e.dataset.p==='height')e.value=1000;else if(e.dataset.p==='top')e.value=70;else if(e.dataset.p==='bottom')e.value=100;else if(e.dataset.p==='left')e.value=150;else if(e.dataset.p==='right')e.value=60;else if(e.dataset.p==='background')e.value='#ffffff';else if(e.dataset.p==='low')e.value='#377eb8';else if(e.dataset.p==='mid')e.value='#ffffff';else if(e.dataset.p==='high')e.value='#e41a1c';else if(e.dataset.p==='steps')e.value=50;else if(e.dataset.p==='na')e.value='#bebebe';else if(e.dataset.p==='borderColor')e.value='#ffffff';else if(e.dataset.p==='borderWidth')e.value=1;else if(e.dataset.p==='title')e.value='蛋白表达模式热图';else if(e.dataset.p==='font')e.value='Arial';else if(e.dataset.p==='titleSize')e.value=30;else if(e.dataset.p==='labelSize')e.value=15;else if(e.dataset.p==='textColor')e.value='#26323d';else if(e.dataset.p==='angle')e.value=45;else if(e.dataset.p==='scale')e.value='row_zscore';else if(e.dataset.p==='distance')e.value='euclidean';else if(e.dataset.p==='method')e.value='complete';else if(e.dataset.p==='legendTitle')e.value='Row Z-score';else if(e.dataset.p==='label')e.value='Control_vs_Treatment';else if(e.dataset.p==='dpi')e.value=2});$('#preset').value='default';$('#status').textContent='设置已恢复默认';draw()}$('#reset').onclick=$('#reset2').onclick=reset;$('#demo').onclick=()=>{try{setDemo();$('#status').textContent='示例数据已载入'}catch(e){showError(e)}};$('#fit').onclick=()=>{$('#plot').style.maxWidth='100%';$('#plot').style.maxHeight='100%'};setDemo();

</script></body></html>
